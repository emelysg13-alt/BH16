{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta | BackHome</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic:wght@100..400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #fff7fa, #fff0f4);
            color: #493b45;
            font-family: "Playwrite NZ Basic", cursive;
        }

        main {
            width: min(100%, 620px);
            padding: 42px;
            text-align: center;
            background: white;
            border: 1px solid #f2dce5;
            border-radius: 24px;
            box-shadow: 0 20px 60px #72455818;
        }

        .paw {
            color: #d87999;
            font-size: 42px;
        }

        h1 {
            font-size: 25px;
        }

        p {
            color: #897d87;
            line-height: 1.9;
            font-size: 13px;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 13px 24px;
            background: #d87999;
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
        }

        button:hover {
            background: #bd6384;
        }

        @media (max-width: 520px) {
            main {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

    <main>

        <div class="paw">🐾</div>

        <h1>¡Hola, {{ nombre }}!</h1>

        <p>
            Has iniciado sesión correctamente en BackHome.
        </p>

        <p>
            Tu espacio de cliente está preparado.
            Aquí construiremos las funciones para gestionar
            tus solicitudes y consultar la información de tus mascotas.
        </p>

        <form method="post" action="{% url 'inicio:cerrar_sesion' %}">
            {% csrf_token %}

            <button type="submit">
                Cerrar sesión
            </button>
        </form>

    </main>

</body>
</html>
